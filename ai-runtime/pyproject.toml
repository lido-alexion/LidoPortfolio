[project]
name = "stox-ai-runtime"
version = "0.1.0"
description = "Private StoX AI execution runtime and governed routing core"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<1",
  "fastmcp>=4,<5",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
