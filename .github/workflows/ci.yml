name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changed.outputs.backend }}
      frontend: ${{ steps.changed.outputs.frontend }}
      vps_health: ${{ steps.changed.outputs.vps_health }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed files
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            changed_files="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git diff --name-only "${{ github.event.before }}" HEAD)"
          else
            changed_files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          fi

          backend=false
          frontend=false
          vps_health=false

          while IFS= read -r file; do
            [[ -n "$file" ]] || continue

            case "$file" in
              app/scripts/vps-health/**|ops/vps-health/**)
                vps_health=true
                ;;
            esac

            case "$file" in
              app/app/*|app/bootstrap/*|app/config/*|app/database/*|app/routes/*|app/tests/*.php|app/tests/**/*.php|app/composer.json|app/composer.lock|app/phpunit.xml|scripts/**|deploy/**|.github/workflows/*.yml|.github/workflows/*.yaml)
                backend=true
                ;;
            esac

            case "$file" in
              app/resources/*|app/resources/**/*|app/tests/js/*|app/tests/js/**/*|app/package.json|app/package-lock.json|app/scripts/write-build-info.mjs|app/tsconfig.json|app/vite.config.js|app/vitest.config.js|scripts/**|.github/workflows/*.yml|.github/workflows/*.yaml)
                frontend=true
                ;;
            esac
          done <<< "$changed_files"

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "vps_health=$vps_health"
          } >> "$GITHUB_OUTPUT"

  backend:
    name: PHPUnit (PHP 8.4)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.backend == 'true'
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: lidoportfolio_ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, mbstring, opentelemetry, pdo_mysql, pdo_sqlite, xml, zlib
          coverage: none
          tools: composer
      - name: Run canonical backend verification
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: lidoportfolio_ci
          DB_USERNAME: root
          DB_PASSWORD: root
        run: ../scripts/verify-ci.sh --backend

  frontend:
    name: Frontend tests and production build (Node 22)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.frontend == 'true'
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Run canonical frontend verification
        run: ../scripts/verify-ci.sh --frontend


  vps-health:
    name: VPS health monitor tests (Python 3.12)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.vps_health == 'true'
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run focused VPS health tests
        run: python -m unittest discover -s ops/vps-health/tests -v

  ai-runtime:
    name: Python AI and FastMCP contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-runtime/requirements.lock
      - name: Install locked runtime and test contracts
        run: python -m pip install -r ai-runtime/requirements.lock -e ./ai-runtime
      - name: Verify private AI runtime and FastMCP
        run: python -m pytest ai-runtime/tests -q
