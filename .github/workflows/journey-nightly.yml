name: StoX journey nightly

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

jobs:
  journeys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Run canonical journey verification
        run: ./scripts/verify-ci.sh --journeys
