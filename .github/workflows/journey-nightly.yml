name: StoX journey nightly

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

jobs:
  journeys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Run canonical journey verification
        run: ./scripts/verify-ci.sh --journeys
      - name: Preserve nightly journey failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-journey-evidence-${{ github.run_id }}
          path: app/tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
