name: Provider smoke monitor

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-provider-smoke:
    name: Public provider availability (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run redacted public provider probes
        run: python3 scripts/provider_smoke.py
      - name: Add provider report to run summary
        if: always()
        run: |
          if [[ -f provider-smoke-report.md ]]; then
            cat provider-smoke-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Provider smoke report was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve provider report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-smoke-report-${{ github.run_id }}
          path: provider-smoke-report.md
          if-no-files-found: ignore
          retention-days: 14
