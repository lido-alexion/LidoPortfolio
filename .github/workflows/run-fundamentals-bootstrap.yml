name: Run StoX Fundamentals Bootstrap

on:
  workflow_dispatch:
    inputs:
      canary_symbol:
        description: Known-good canary symbol
        required: true
        default: TCS
      batch:
        description: Stocks per durable production slice
        required: true
        default: "10"
      run_id:
        description: Existing bootstrap run to resume; leave blank only for a new guarded snapshot
        required: false
        default: ""
      slice_seconds:
        description: Maximum worker slice duration in seconds before a resumable clean exit
        required: true
        default: "2400"

permissions:
  contents: read

concurrency:
  group: stoxla-fundamentals-bootstrap
  cancel-in-progress: false

jobs:
  run:
    name: Controlled production fundamentals bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run guarded canary and full durable snapshot
        env:
          STOXLA_HOST: ${{ secrets.STOXLA_HOST }}
          STOXLA_SSH_PRIVATE_KEY: ${{ secrets.STOXLA_SSH_PRIVATE_KEY }}
          STOXLA_SSH_USER: ${{ secrets.STOXLA_SSH_USER }}
          STOXLA_FUNDAMENTALS_CANARY_SYMBOL: ${{ inputs.canary_symbol }}
          STOXLA_FUNDAMENTALS_BOOTSTRAP_BATCH: ${{ inputs.batch }}
          STOXLA_FUNDAMENTALS_RUN_ID: ${{ inputs.run_id }}
          STOXLA_FUNDAMENTALS_SLICE_SECONDS: ${{ inputs.slice_seconds }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STOXLA_SSH_PRIVATE_KEY" > ~/.ssh/stoxla_deploy_key
          chmod 600 ~/.ssh/stoxla_deploy_key
          ssh-keyscan -H "$STOXLA_HOST" >> ~/.ssh/known_hosts
          ssh_opts=(-i ~/.ssh/stoxla_deploy_key -o IdentitiesOnly=yes -o BatchMode=yes)

          [[ "$STOXLA_FUNDAMENTALS_CANARY_SYMBOL" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || {
            echo "invalid canary symbol input" >&2
            exit 2
          }
          [[ "$STOXLA_FUNDAMENTALS_BOOTSTRAP_BATCH" =~ ^[0-9]+$ ]] || {
            echo "invalid batch input" >&2
            exit 2
          }
          (( STOXLA_FUNDAMENTALS_BOOTSTRAP_BATCH >= 1 && STOXLA_FUNDAMENTALS_BOOTSTRAP_BATCH <= 100 )) || {
            echo "batch input must be between 1 and 100" >&2
            exit 2
          }
          if [[ -n "$STOXLA_FUNDAMENTALS_RUN_ID" ]]; then
            [[ "$STOXLA_FUNDAMENTALS_RUN_ID" =~ ^[0-9]+$ ]] || {
              echo "invalid run_id input" >&2
              exit 2
            }
          fi
          [[ "$STOXLA_FUNDAMENTALS_SLICE_SECONDS" =~ ^[0-9]+$ ]] || {
            echo "invalid slice_seconds input" >&2
            exit 2
          }
          (( STOXLA_FUNDAMENTALS_SLICE_SECONDS >= 60 && STOXLA_FUNDAMENTALS_SLICE_SECONDS <= 2700 )) || {
            echo "slice_seconds input must be between 60 and 2700" >&2
            exit 2
          }

          printf -v remote_command \
            'env STOXLA_FUNDAMENTALS_CANARY_SYMBOL=%q STOXLA_FUNDAMENTALS_BOOTSTRAP_BATCH=%q STOXLA_FUNDAMENTALS_RUN_ID=%q STOXLA_FUNDAMENTALS_SLICE_SECONDS=%q bash %q' \
            "$STOXLA_FUNDAMENTALS_CANARY_SYMBOL" \
            "$STOXLA_FUNDAMENTALS_BOOTSTRAP_BATCH" \
            "$STOXLA_FUNDAMENTALS_RUN_ID" \
            "$STOXLA_FUNDAMENTALS_SLICE_SECONDS" \
            "/var/www/stoxla/current/deploy/scripts/stoxla-run-fundamentals-bootstrap.sh"
          ssh "${ssh_opts[@]}" "${STOXLA_SSH_USER}@${STOXLA_HOST}" "$remote_command"
