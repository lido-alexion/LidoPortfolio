name: Deploy StoXla Production

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.repository == 'lido-alexion/LidoPortfolio' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: stoxla-production-deploy
      cancel-in-progress: false
    environment: production
    steps:
      - name: Require mandatory production smoke identity before activation
        env:
          STOX_SMOKE_EMAIL: ${{ secrets.STOX_SMOKE_EMAIL }}
          STOX_SMOKE_PASSWORD: ${{ secrets.STOX_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${STOX_SMOKE_EMAIL:-}" ] || [ -z "${STOX_SMOKE_PASSWORD:-}" ]; then
            echo "::error::Production activation blocked: configure the dedicated read-only smoke identity in STOX_SMOKE_EMAIL and STOX_SMOKE_PASSWORD Actions secrets."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download release archive
        uses: actions/download-artifact@v4
        with:
          name: stoxla-release-${{ github.sha }}

      - name: Configure SSH
        env:
          STOXLA_HOST: ${{ secrets.STOXLA_HOST }}
          STOXLA_SSH_PRIVATE_KEY: ${{ secrets.STOXLA_SSH_PRIVATE_KEY }}
        run: |
          test -n "$STOXLA_HOST"
          test -n "$STOXLA_SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STOXLA_SSH_PRIVATE_KEY" > ~/.ssh/stoxla_deploy_key
          chmod 600 ~/.ssh/stoxla_deploy_key
          ssh-keyscan -H "$STOXLA_HOST" >> ~/.ssh/known_hosts

      - name: Upload and activate release
        env:
          STOXLA_HOST: ${{ secrets.STOXLA_HOST }}
          STOXLA_SSH_USER: ${{ secrets.STOXLA_SSH_USER }}
          RELEASE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$STOXLA_HOST"
          test -n "$STOXLA_SSH_USER"
          RELEASE_ID="$(date -u +%Y%m%d%H%M%S)-${RELEASE_SHA::12}"
          REMOTE_DIR="/home/${STOXLA_SSH_USER}/.stoxla-deploy/${RELEASE_ID}"
          SSH_OPTS="-i ~/.ssh/stoxla_deploy_key -o IdentitiesOnly=yes -o BatchMode=yes"

          ssh $SSH_OPTS "${STOXLA_SSH_USER}@${STOXLA_HOST}" "mkdir -p '${REMOTE_DIR}'"
          scp $SSH_OPTS stoxla-release.tgz deploy/scripts/stoxla-deploy-release.sh deploy/scripts/stoxla-rollback-release.sh deploy/scripts/stoxla-runtime-health-check.sh "${STOXLA_SSH_USER}@${STOXLA_HOST}:${REMOTE_DIR}/"
          ssh $SSH_OPTS "${STOXLA_SSH_USER}@${STOXLA_HOST}" \
            "chmod 700 '${REMOTE_DIR}/stoxla-deploy-release.sh' '${REMOTE_DIR}/stoxla-rollback-release.sh' '${REMOTE_DIR}/stoxla-runtime-health-check.sh' && cp '${REMOTE_DIR}/stoxla-rollback-release.sh' '/home/${STOXLA_SSH_USER}/.stoxla-deploy/stoxla-rollback-release.sh' && cp '${REMOTE_DIR}/stoxla-runtime-health-check.sh' '/home/${STOXLA_SSH_USER}/.stoxla-deploy/stoxla-runtime-health-check.sh'"
          master_response="$(curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/master")"
          printf '%s' "$master_response" | python3 -c '
          import json
          import os
          import sys

          try:
              payload = json.load(sys.stdin)
              master_sha = payload["commit"]["sha"]
          except (json.JSONDecodeError, KeyError, TypeError) as error:
              raise SystemExit(f"Could not read authoritative master SHA: {error}")

          candidate_sha = os.environ["RELEASE_SHA"]
          if master_sha != candidate_sha:
              raise SystemExit(f"Production activation blocked: candidate {candidate_sha} is not current master {master_sha}")
          print(f"Current master matches candidate {candidate_sha}")
          '
          ssh $SSH_OPTS "${STOXLA_SSH_USER}@${STOXLA_HOST}" \
            "STOXLA_RELEASE_ID='${RELEASE_ID}' STOXLA_EXPECTED_COMMIT='${RELEASE_SHA}' '${REMOTE_DIR}/stoxla-deploy-release.sh' '${REMOTE_DIR}/stoxla-release.tgz'"

      - name: Post-deploy health check
        env:
          STOXLA_HOST: ${{ secrets.STOXLA_HOST }}
          STOXLA_SSH_USER: ${{ secrets.STOXLA_SSH_USER }}
          STOXLA_SSH_PRIVATE_KEY: ${{ secrets.STOXLA_SSH_PRIVATE_KEY }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/stoxla_deploy_key -o IdentitiesOnly=yes -o BatchMode=yes"
          ssh $SSH_OPTS "${STOXLA_SSH_USER}@${STOXLA_HOST}" \
            "STOXLA_EXPECTED_COMMIT='${EXPECTED_SHA}' /home/${STOXLA_SSH_USER}/.stoxla-deploy/stoxla-runtime-health-check.sh"
          curl --fail --silent --show-error --location --max-time 20 https://stoxla.in/ >/dev/null
          build_info="$(mktemp)"
          curl --fail --silent --show-error --location --max-time 20 https://stoxla.in/api/build-info > "$build_info"
          python3 - "$build_info" "$EXPECTED_SHA" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              payload = json.load(handle)
          actual = (payload.get("data") or {}).get("commit_sha")
          if actual != sys.argv[2]:
              raise SystemExit(f"Expected deployed commit {sys.argv[2]}, got {actual}")
          PY
          html="$(mktemp)"
          headers="$(mktemp)"
          curl --fail --silent --show-error --location --max-time 20 https://stoxla.in/ > "$html"
          module_src="$(grep -oE '<script[^>]+type="module"[^>]+src="[^"]+"' "$html" | head -n 1 | sed -E 's/.*src="([^"]+)".*/\1/')"
          test -n "$module_src"
          curl --fail --silent --show-error --location --max-time 20 -D "$headers" -o /dev/null "https://stoxla.in${module_src}"
          grep -qiE '^content-type: .*javascript' "$headers"

      - name: Set up Node for post-deploy browser smoke
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install browser smoke dependencies
        working-directory: app
        run: npm ci --registry=https://registry.npmjs.org

      - name: Install Chromium for browser smoke
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Run non-destructive production browser smoke
        working-directory: app
        env:
          STOX_E2E_BASE_URL: https://stoxla.in
          STOX_SMOKE_EMAIL: ${{ secrets.STOX_SMOKE_EMAIL }}
          STOX_SMOKE_PASSWORD: ${{ secrets.STOX_SMOKE_PASSWORD }}
        run: npm run test:e2e:production-smoke

      - name: Preserve production smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ github.sha }}
          path: app/tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
